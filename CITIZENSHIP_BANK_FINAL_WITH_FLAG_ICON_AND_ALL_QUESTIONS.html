let currentMode = "test";
let currentQuestions = [];
let answerMap = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function makeQuestionHTML(q, index, mode) {
  const options = shuffle(q.options);
  answerMap[index] = {
    correct: q.correct,
    isValue: q.isValue
  };

  const valueClass = q.isValue ? " value" : "";
  const valueBadge = q.isValue ? '<div class="valueBadge">VALUES QUESTION — MUST GET CORRECT</div>' : "";

  let html = `<div class="question${valueClass}" data-index="${index}" data-value="${q.isValue ? 'true' : 'false'}">`;
  html += valueBadge;
  html += `<div class="tag">${esc(q.tag)}</div>`;
  html += `<h3>${index + 1}. ${esc(q.question)}</h3>`;

  options.forEach((opt, oi) => {
    const letter = ["A", "B", "C"][oi];
    const click = mode === "all" ? ' onchange="markSingleQuestion(this)"' : "";
    const correctClass = opt === q.correct ? "correct" : "wrong";

    html += `<label class="option">`;
    html += `<input type="radio" name="q${index}" value="${esc(opt)}" class="${correctClass}"${click}> `;
    html += `${letter}) ${esc(opt)}`;
    html += `</label>`;
  });

  html += `<div class="correctAnswer">Correct answer: <span>${esc(q.correct)}</span></div>`;
  html += `</div>`;
  return html;
}

function renderQuestions(list, mode) {
  answerMap = [];
  const box = document.getElementById("questions");
  box.innerHTML = list.map((q, i) => makeQuestionHTML(q, i, mode)).join("");
}

function generateTest() {
  currentMode = "test";

  const values = shuffle(QUESTION_BANK.filter(q => q.isValue)).slice(0, 5);
  const normal = shuffle(QUESTION_BANK.filter(q => !q.isValue)).slice(0, 15);

  currentQuestions = shuffle(values.concat(normal));
  renderQuestions(currentQuestions, "test");

  const result = document.getElementById("result");
  result.style.display = "none";
  result.innerHTML = "";

  document.getElementById("modeNotice").innerHTML =
    "Test mode: 20 random questions loaded. You need 15/20 overall AND all 5 values questions correct.";

  window.scrollTo(0, 0);
}

function showAllQuestions() {
  currentMode = "all";
  currentQuestions = QUESTION_BANK.slice();
  renderQuestions(currentQuestions, "all");

  const result = document.getElementById("result");
  result.style.display = "none";
  result.innerHTML = "";

  document.getElementById("modeNotice").innerHTML =
    "All questions mode: select an answer and it marks that question instantly. No pass/fail score in this mode.";

  window.scrollTo(0, 0);
}

function clearQuestionMarks(qDiv) {
  qDiv.classList.remove("correctQuestion", "wrongQuestion");
  qDiv.querySelectorAll(".option").forEach(label => {
    label.classList.remove("correctOption", "wrongOption");
  });
}

function markSingleQuestion(input) {
  const qDiv = input.closest(".question");
  clearQuestionMarks(qDiv);

  const answerBox = qDiv.querySelector(".correctAnswer");
  const correctInput = qDiv.querySelector("input.correct");

  if (input.classList.contains("correct")) {
    qDiv.classList.add("correctQuestion");
    input.closest(".option").classList.add("correctOption");
    answerBox.style.display = "none";
  } else {
    qDiv.classList.add("wrongQuestion");
    input.closest(".option").classList.add("wrongOption");
    if (correctInput) correctInput.closest(".option").classList.add("correctOption");
    answerBox.style.display = "block";
  }
}

function markTest() {
  if (currentMode !== "test") {
    alert("Mark Test only works in 20-question test mode. In Show All mode, each question marks instantly.");
    return;
  }

  const qs = document.querySelectorAll(".question");
  let score = 0;
  let valueCorrect = 0;
  let valueTotal = 0;

  qs.forEach(qDiv => {
    clearQuestionMarks(qDiv);

    const isValue = qDiv.dataset.value === "true";
    if (isValue) valueTotal++;

    const checked = qDiv.querySelector("input[type=radio]:checked");
    const answerBox = qDiv.querySelector(".correctAnswer");
    const correctInput = qDiv.querySelector("input.correct");

    answerBox.style.display = "none";

    if (checked && checked.classList.contains("correct")) {
      score++;
      qDiv.classList.add("correctQuestion");
      checked.closest(".option").classList.add("correctOption");
      if (isValue) valueCorrect++;
    } else {
      qDiv.classList.add("wrongQuestion");
      if (checked) checked.closest(".option").classList.add("wrongOption");
      if (correctInput) correctInput.closest(".option").classList.add("correctOption");
      answerBox.style.display = "block";
    }
  });

  const percent = Math.round((score / 20) * 100);
  const pass = score >= 15 && valueCorrect === 5;

  const result = document.getElementById("result");
  result.style.display = "block";

  if (pass) {
    result.style.background = "#e8ffe8";
    result.style.color = "#006b1f";
    result.innerHTML =
      "✅ PASS<br><br>" +
      "Score: " + score + "/20 (" + percent + "%)<br>" +
      "Values Questions: " + valueCorrect + "/5";
  } else {
    let reason = "";
    if (score < 15) reason += "Overall score below 75%.<br>";
    if (valueCorrect < 5) reason += "One or more values questions incorrect.<br>";

    result.style.background = "#fff0f0";
    result.style.color = "#8a0000";
    result.innerHTML =
      "❌ FAIL<br><br>" +
      "Score: " + score + "/20 (" + percent + "%)<br>" +
      "Values Questions: " + valueCorrect + "/5<br><br>" +
      reason;
  }

  window.scrollTo(0, 0);
}

generateTest();
</script>
