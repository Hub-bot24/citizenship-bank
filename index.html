let current=[];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function pick(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function render(list,msg){current=list;document.getElementById('notice').innerHTML=msg;document.getElementById('result').style.display='none';const box=document.getElementById('questions');box.innerHTML='';
list.forEach((q,i)=>{const d=document.createElement('div');d.className='question'+(q.isValue?' value':'');d.dataset.correct=q.correct;
if(q.isValue){const b=document.createElement('div');b.className='badge';b.textContent='MUST GET RIGHT — VALUES';d.appendChild(b)}
const tag=document.createElement('div');tag.className='tag';tag.textContent=q.tag||'';d.appendChild(tag);
const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.question;d.appendChild(h);
shuffle(q.options||[]).forEach(opt=>{const lab=document.createElement('label');lab.className='option';const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=opt;inp.onchange=()=>markOne(d,q.correct);const sp=document.createElement('span');sp.textContent=opt;lab.appendChild(inp);lab.appendChild(sp);d.appendChild(lab)});
const ans=document.createElement('div');ans.className='answer';ans.textContent='Correct answer: '+q.correct;d.appendChild(ans);box.appendChild(d)})}
function markOne(card,correct){const selected=card.querySelector('input:checked');if(!selected)return;card.querySelectorAll('.option').forEach(l=>{const v=l.querySelector('input').value;l.classList.remove('correctOption','wrongOption');if(v===correct)l.classList.add('correctOption');if(l.querySelector('input').checked&&v!==correct)l.classList.add('wrongOption')});card.classList.remove('correctQuestion','wrongQuestion');card.classList.add(selected.value===correct?'correctQuestion':'wrongQuestion');card.querySelector('.answer').style.display='block'}
function markTest(){const cards=[...document.querySelectorAll('.question')];let correct=0,answered=0,vwrong=0,vtotal=0;cards.forEach(c=>{const right=c.dataset.correct;const sel=c.querySelector('input:checked');if(c.classList.contains('value'))vtotal++;if(sel){answered++;if(sel.value===right)correct++;else if(c.classList.contains('value'))vwrong++;markOne(c,right)}else{c.classList.add('wrongQuestion');c.querySelector('.answer').style.display='block';if(c.classList.contains('value'))vwrong++}});const pct=cards.length?Math.round(correct/cards.length*100):0;const pass=(cards.length===20?correct>=15:pct>=75)&&vwrong===0;const r=document.getElementById('result');r.style.display='block';r.style.background=pass?'#dfffe6':'#ffe1e1';r.innerHTML=(pass?'✅ PASS':'❌ NOT PASS')+' — '+correct+'/'+cards.length+' ('+pct+'%)<br>Answered: '+answered+'/'+cards.length+'<br>Values wrong: '+vwrong+'/'+vtotal;window.scrollTo({top:0,behavior:'smooth'})}
function generateTest(){render(pick(QUESTION_BANK,20),'🎲 Main test: 20 random questions. Need 15/20 and all values correct.')}
function showAll(){render(QUESTION_BANK,'📚 Showing all questions. Total: '+QUESTION_BANK.length)}
function showGovernment(){render(GOVERNMENT_BANK,'🏛️ Government Master: government-only questions. Total: '+GOVERNMENT_BANK.length)}
